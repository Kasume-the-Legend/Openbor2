name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install the NDK the project asks for
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;21.4.7075529" "build-tools;36.0.0" "platforms;android-35"
      - name: Build
        working-directory: engine/android
        env:
          OPENBOR_RELAY_URL: ${{ vars.RELAY_URL }}   # e.g. wss://openbor-online-relay.YOURNAME.workers.dev/ws (repo Settings > Variables)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBOR-Online-APK
          path: engine/android/app/build/outputs/apk/debug/*.apk

      - name: Publish the shell APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls engine/android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" OpenBOR-shell.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest OpenBOR-shell.apk --title "Android shell (latest)" --notes "Latest Android build without a game baked in. The game is injected into this APK separately." --target "${{ github.sha }}"
