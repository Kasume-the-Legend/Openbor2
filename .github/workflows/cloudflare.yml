name: Deploy Cloudflare relay
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'cloudflare/**' ]
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Deploy the Worker
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy 2>&1 | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Show the address players use
        working-directory: cloudflare
        run: |
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*workers.dev' deploy.log | head -1)
          echo "Relay address: ${URL/https:/wss:}/ws" | tee -a "$GITHUB_STEP_SUMMARY"
