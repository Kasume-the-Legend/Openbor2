name: Deploy Cloudflare relay
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths: [ 'cloudflare/**' ]
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Deploy the Worker
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy 2>&1 | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Show the address players use
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import sys,json; print((json.load(sys.stdin).get("result") or {}).get("subdomain",""))')
          if [ -n "$SUB" ]; then echo "Relay address: wss://openbor-online-relay.$SUB.workers.dev/ws" | tee -a "$GITHUB_STEP_SUMMARY"
          else echo "Relay deployed. Find its address in Cloudflare: Workers & Pages > openbor-online-relay > Settings > Domains & Routes, then use wss://THAT-HOST/ws" | tee -a "$GITHUB_STEP_SUMMARY"; fi
